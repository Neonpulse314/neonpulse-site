<circle cx="611" cy="194" r="3.5" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.3"/>
<text x="620" y="305" text-anchor="middle" font-size="12.5" fill="#2e6b32">gas bubble FORMS in joint fluid</text>
<text x="620" y="325" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a6ea5">what a 2015 MRI saw ✓</text>
<text x="430.0" y="368" text-anchor="middle" font-size="13" fill="#333">The crunch is a bubble appearing, not a joint wearing out. The sound is loud; the damage is imaginary.</text>
