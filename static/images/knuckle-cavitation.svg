<line x1="214" y1="178" x2="220" y2="188" stroke="#b9534b" stroke-width="2.5"/>
<line x1="226" y1="178" x2="232" y2="188" stroke="#b9534b" stroke-width="2.5"/>
<line x1="238" y1="178" x2="244" y2="188" stroke="#b9534b" stroke-width="2.5"/>
<text x="220" y="290" text-anchor="middle" font-size="12.5" fill="#8a2f27">cartilage grinding → wear</text>
<text x="220" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b9534b">what intuition hears ✗</text>
