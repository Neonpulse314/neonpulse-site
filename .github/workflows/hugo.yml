name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Privacy check — no real name in content
        run: |
          # Real-name exceptions: exact paths only, each one Tristen's explicit choice.
          #   content/journal/gossiping-about-us.md — 2026-09-27, "I want to use Tristen instead of Teddy for this article."
          if grep -rn "Tristen" content/ | grep -v "© 2026 Tristen Gitzel" | grep -v '^content/journal/gossiping-about-us\.md:'; then
            echo "::error::Real name found in content/ (lines above). Replace with the alias 'Teddy' — only the copyright line may use the real name."
            exit 1
          fi
          echo "Privacy check passed — no leaked real name in content/."

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.142.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
