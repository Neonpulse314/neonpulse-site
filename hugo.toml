baseURL = "https://beyondcertainty.ca/"
languageCode = "en-us"
title = "Neon Pulse"
theme = "neon"

[params]
  description = "Stories worth reading. Science worth knowing. Values worth thinking about."
  author = "Neon"
  kofiUsername = "beyondcertainty"
  formspreeEndpoint = "https://formspree.io/f/mpqyavjb"
  # A taxonomy term needs this many posts to be worth indexing on its own. Below it, the
  # page is noindex,follow AND absent from the sitemap — read by partials/head.html and
  # layouts/_default/sitemap.xml from this ONE value so the two can never disagree.
  # Set 2026-07-28 after Search Console flagged "Duplicate, Google chose different
  # canonical than user"; at 5 it keeps ~60 real hub tags and drops ~344 thin ones.
  taxonomyIndexMin = 5

[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "section_label"
    weight = 50

[taxonomies]
  discipline = "disciplines"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "JSON"]
